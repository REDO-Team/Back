name: CI/CD

on:
  push:
    branches:
      - develop

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/redo-team/back

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:develop
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    name: Deploy backend
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ghcr.io/redo-team/back:${{ github.sha }}

    steps:
      - name: Log in to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Update source and deploy image
        working-directory: /home/ubuntu/Back
        run: |
          set -euo pipefail

          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop

          docker compose config -q
          docker compose pull app redis
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Verify application
        working-directory: /home/ubuntu/Back
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error http://localhost:8080/swagger-ui.html > /dev/null; then
              exit 0
            fi

            sleep 5
          done

          docker compose logs --tail=100 app
          exit 1

      - name: Remove old unused images
        if: success()
        run: docker image prune --all --force --filter "until=168h"

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io
