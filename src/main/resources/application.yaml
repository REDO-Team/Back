spring:
  application:
    name: redo-back

  ai:
    model:
      chat: google-genai
    retry:
      max-attempts: ${GEMINI_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 5s
      on-client-errors: false
      on-http-codes:
        - 429
        - 500
        - 502
        - 503
        - 504
    google:
      genai:
        api-key: ${GEMINI_API_KEY:local-disabled}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

  mvc:
    async:
      request-timeout: ${CERTIFICATION_HTTP_ASYNC_TIMEOUT:220s}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

juso:
  address-search-url: https://business.juso.go.kr/addrlink/addrLinkApi.do
  confirmation-key: ${JUSO_API_KEY:}
  response-timeout-millis: ${JUSO_RESPONSE_TIMEOUT_MILLIS:5000}

aws:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    max-file-size: 10MB
    presigned-url-expiration: 10m

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: 9101
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

app:
  base-url: http://13.209.188.93:8080
  certification:
    judgement:
      timeout: ${CERTIFICATION_JUDGEMENT_TIMEOUT:210s}
      core-pool-size: ${CERTIFICATION_JUDGEMENT_CORE_POOL_SIZE:2}
      max-pool-size: ${CERTIFICATION_JUDGEMENT_MAX_POOL_SIZE:4}
      queue-capacity: ${CERTIFICATION_JUDGEMENT_QUEUE_CAPACITY:20}
  ai:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      timeout: ${GEMINI_TIMEOUT:30s}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}
      max-media-count: ${GEMINI_MAX_MEDIA_COUNT:4}
      max-media-size: ${GEMINI_MAX_MEDIA_SIZE:10MB}
