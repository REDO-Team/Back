x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
    image: ${BACKEND_IMAGE:-redo-backend:local}
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -Duser.timezone=Asia/Seoul
    ports:
      - "8080:8080"
      - target: 9101
        published: "9101"
        host_ip: "${SERVICE_PRIVATE_IP:?SERVICE_PRIVATE_IP_required}"
        protocol: tcp
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    ports:
      - target: 9100
        published: "9100"
        host_ip: "${SERVICE_PRIVATE_IP:?SERVICE_PRIVATE_IP_required}"
        protocol: tcp
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /run/udev/data:/run/udev/data:ro
    cpus: "0.15"
    mem_limit: 64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - target: 9121
        published: "9121"
        host_ip: "${SERVICE_PRIVATE_IP:?SERVICE_PRIVATE_IP_required}"
        protocol: tcp
    depends_on:
      redis:
        condition: service_healthy
    cpus: "0.10"
    mem_limit: 64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.2
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    cpus: "0.10"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.1
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MONITORING_PRIVATE_IP: ${MONITORING_PRIVATE_IP:?MONITORING_PRIVATE_IP_required}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-redo}
      LOKI_BASIC_AUTH_USERNAME: ${LOKI_BASIC_AUTH_USERNAME:?LOKI_BASIC_AUTH_USERNAME_required}
      LOKI_BASIC_AUTH_PASSWORD: ${LOKI_BASIC_AUTH_PASSWORD:?LOKI_BASIC_AUTH_PASSWORD_required}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./monitoring/alloy/certs/loki-ca.crt:/etc/alloy/certs/loki-ca.crt:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks:
      - default
      - docker-api
    cpus: "0.20"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  redis-data:
  alloy-data:

networks:
  docker-api:
    internal: true
