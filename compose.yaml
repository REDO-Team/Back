services:
  app:
    build:
      context: .
    image: ${BACKEND_IMAGE:-redo-backend:local}
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
